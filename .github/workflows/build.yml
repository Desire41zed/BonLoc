name: Build BonLoc APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Cordova
        run: npm install -g cordova

      - name: Create Cordova Project
        run: |
          cordova create bonloc_app com.bonloc.app BonLoc
          cp -r www/* bonloc_app/www/
          cd bonloc_app
          cordova platform add android

      - name: Setup Java JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '11'

      - name: Build Android APK
        run: |
          cd bonloc_app
          cordova build android --debug

      - name: Upload APK File
        uses: actions/upload-artifact@v3
        with:
          name: BonLoc-App
          path: bonloc_app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
